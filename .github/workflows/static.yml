# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare clean public URLs
        run: |
          mkdir -p .pages-site
          rsync -a --exclude '.git' --exclude '.pages-site' ./ .pages-site/
          cp 'Print-Frame/print-frame.html' '.pages-site/print-and-frame-online.html'
          cp 'Pricing/pricing.html' '.pages-site/printing-framing-prices.html'
          cp 'About Us/AboutUs.html' '.pages-site/about.html'
          cp 'FAQ/FAQ.html' '.pages-site/printing-framing-faq.html'
          cp 'Checkout/success.html' '.pages-site/order-confirmation.html'
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.pages-site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
